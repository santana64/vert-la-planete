name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Typecheck - Lint - Test - Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vert_la_planete_test
      AUTH_SECRET: ci-only-auth-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vert_la_planete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vert_la_planete_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
